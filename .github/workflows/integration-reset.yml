name: integration-reset (reusable)

# Reusable: riallinea il branch `integration` a `main` e ri-applica le feature
# ancora in-flight, cioè quelle con una PR aperta verso main non ancora mergiata.
#
# Il match è per chiave ticket (es. MGC-1234), stabile a rebase e squash: si
# ri-applicano i branch delle PR aperte il cui ticket compare nei commit presenti
# su integration e non su main; le feature già entrate in main (PR chiusa) vengono
# droppate. I conflitti in ri-applicazione sono saltati e segnalati, tranne quelli che
# toccano solo i file dichiarati in `append_only_paths`: lì il conflitto è una collisione
# di append e viene risolto tenendo la base e ri-appendendo il blocco del branch.
#
# Cross-repo usage:
#   jobs:
#     reset:
#       permissions:
#         contents: write        # push forzato su integration
#         pull-requests: read    # lettura delle PR aperte  <-- indispensabile
#         actions: write         # solo se si usa deploy_workflow
#       uses: mycomp-it/ci-cd-reusable-actions/.github/workflows/integration-reset.yml@main
#       with:
#         deploy_workflow: stg-build-deploy.yml   # gira sui runner self-hosted dell'org
#         append_only_paths: path/to/updatemodel.sql   # conflitti di append risolti da soli
#       secrets:
#         token: ${{ secrets.GITHUB_TOKEN }}
#         slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
#
# ATTENZIONE ai permessi: in un reusable workflow il GITHUB_TOKEN eredita i permessi
# del CALLER e il chiamato può solo restringerli. Se il caller dichiara un blocco
# `permissions:` senza `pull-requests: read`, la lettura delle PR risponde 403: qui il
# job si ferma PRIMA di toccare integration, invece di resettarlo perdendo le feature.
#
# Il push con il GITHUB_TOKEN di default non ri-triggera altri workflow: per questo il
# deploy si lancia con un workflow_dispatch esplicito (`deploy_workflow`). Se serve che
# il push stesso inneschi CI, passare un PAT / GitHub App token come secrets.token.
on:
  workflow_call:
    inputs:
      integration_branch:
        description: Branch di integrazione da riallineare.
        required: false
        default: integration
        type: string
      base_branch:
        description: Branch di riferimento a cui riallineare (la linea rilasciata).
        required: false
        default: main
        type: string
      ticket_prefix:
        description: Prefisso della chiave ticket usata per il match (es. MGC -> MGC-1234).
        required: false
        default: MGC
        type: string
      append_only_paths:
        description: >-
          Path (separati da spazi) di file append-only, es. il file delle migrazioni SQL.
          Un conflitto di merge che tocca SOLO questi file viene risolto automaticamente
          tenendo la versione della base e ri-appendendo il blocco del branch. Vuoto = nessuno.
        required: false
        default: ''
        type: string
      jira_base_url:
        description: Base URL per i link ticket nel report Slack.
        required: false
        default: 'https://myguestcare.atlassian.net/browse'
        type: string
      deploy_workflow:
        description: >-
          File del workflow di deploy da lanciare (workflow_dispatch) sul branch di
          integrazione dopo il reset, es. stg-build-deploy.yml. Vuoto = nessun deploy.
        required: false
        default: ''
        type: string
      dry_run:
        description: Esegue tutto senza pushare, senza deploy e senza notifica Slack.
        required: false
        default: false
        type: boolean
      runner:
        description: Label del runner. Override a ubuntu-latest per i repo senza runner propri.
        required: false
        default: self-hosted
        type: string
      git_user_name:
        description: git user.name per i commit di merge.
        required: false
        default: github-actions[bot]
        type: string
      git_user_email:
        description: git user.email per i commit di merge.
        required: false
        default: 41898282+github-actions[bot]@users.noreply.github.com
        type: string
    secrets:
      token:
        description: Token con contents:write (push) e pull-requests:read (lettura PR).
        required: true
      slack_webhook_url:
        description: Webhook Slack per il report. Se assente la notifica viene saltata.
        required: false

jobs:
  reset:
    name: Reset ${{ inputs.integration_branch }} a ${{ inputs.base_branch }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      - name: Checkout (storia completa)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.token }}
          persist-credentials: true

      - name: Reset + reapply feature in-flight
        # I valori non fidati (nomi di branch, titoli PR) passano da env e finiscono
        # solo come argomenti quotati: mai interpolati nello shell.
        env:
          GH_TOKEN: ${{ secrets.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
          INTEGRATION_BRANCH: ${{ inputs.integration_branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          TICKET_PREFIX: ${{ inputs.ticket_prefix }}
          APPEND_ONLY_PATHS: ${{ inputs.append_only_paths }}
          JIRA_BASE: ${{ inputs.jira_base_url }}
          DEPLOY_WORKFLOW: ${{ inputs.deploy_workflow }}
          DRY_RUN: ${{ inputs.dry_run }}
          GIT_USER_NAME: ${{ inputs.git_user_name }}
          GIT_USER_EMAIL: ${{ inputs.git_user_email }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          git config user.name  "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

          # Tutti i branch remoti (il checkout imposta un refspec ristretto).
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          for b in "$BASE_BRANCH" "$INTEGRATION_BRANCH"; do
            if ! git show-ref --verify --quiet "refs/remotes/origin/${b}"; then
              echo "::error::Branch '${b}' inesistente su origin."
              exit 1
            fi
          done

          TICKET_RE="${TICKET_PREFIX}-[0-9]+"

          api() {
            curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
                 -H "Accept: application/vnd.github+json" "$@"
          }

          slack() {
            [ -n "${SLACK_WEBHOOK_URL:-}" ] || return 0
            [ "$DRY_RUN" = "true" ] && { echo "[dry-run] Slack: $1"; return 0; }
            curl -sf -X POST -H 'Content-type: application/json' \
              --data "$(jq -n --arg t "$1" '{text: $t}')" "$SLACK_WEBHOOK_URL" >/dev/null || true
          }

          is_append_only() {
            local f=$1 p
            for p in ${APPEND_ONLY_PATHS:-}; do [ "$f" = "$p" ] && return 0; done
            return 1
          }

          # Su un file append-only (le migrazioni SQL) il conflitto non e' una divergenza
          # semantica ma una collisione di append: ogni branch aperto prima del commit che
          # svuota il file a rilascio avvenuto ne ha ancora il contenuto vecchio, mentre la
          # base l'ha troncato. Senza questa risoluzione ogni PR con migrazione conflitta a
          # ogni release, per sempre, e va re-integrata a mano.
          # Risoluzione: contenuto della base + le sole righe che il branch aggiunge rispetto
          # alla propria merge-base. Le migrazioni gia' rilasciate stanno nella merge-base,
          # quindi non vengono resuscitate.
          # Vale solo se TUTTI i file in conflitto sono dichiarati append-only: basta un file
          # di codice fra i conflitti e si torna allo skip, che e' il comportamento sicuro.
          resolve_append_only() {
            local branch=$1 f mb block base_last
            [ -n "${APPEND_ONLY_PATHS:-}" ] || return 1
            mb=$(git merge-base HEAD "origin/${branch}") || return 1
            for f in $(git diff --name-only --diff-filter=U); do
              is_append_only "$f" || return 1
            done
            for f in $(git diff --name-only --diff-filter=U); do
              block=$(mktemp)
              # `set -e` non e' attivo qui dentro (la funzione gira in un contesto di
              # condizione): senza il controllo esplicito, un blocco vuoto passerebbe come
              # risoluzione riuscita e la migrazione del branch sparirebbe in silenzio.
              git diff "$mb" "origin/${branch}" -- "$f" \
                | grep '^+' | grep -v '^+++' | sed 's/^+//; s/\r$//' > "$block" || true
              if [ ! -s "$block" ]; then rm -f "$block"; return 1; fi
              # Un file senza newline finale fa ricomparire la sua ultima riga fra le aggiunte.
              base_last=$(git show "${mb}:${f}" 2>/dev/null | tail -1 | sed 's/\r$//' || true)
              if [ -n "$base_last" ] && [ "$(head -1 "$block")" = "$base_last" ]; then
                sed -i 1d "$block"
              fi
              git show "HEAD:${f}" > "$f" 2>/dev/null || : > "$f"
              # Il file sulla base puo' essere CRLF mentre il branch scrive il blocco in LF:
              # senza allineare i fine riga resta un file misto.
              if tail -1 "$f" | grep -q $'\r$'; then sed -i 's/$/\r/' "$block"; fi
              cat "$block" >> "$f"
              rm -f "$block"
              git add "$f"
            done
            return 0
          }

          # 1) Ticket presenti su integration oltre la base (in-flight candidati).
          #    Si guarda anche il body dei commit, non solo il subject.
          mapfile -t INT_TICKETS < <(git log "origin/${BASE_BRANCH}..origin/${INTEGRATION_BRANCH}" --format='%s%n%b' \
            | grep -oE "$TICKET_RE" | sort -u)
          echo "Ticket su ${INTEGRATION_BRANCH} oltre ${BASE_BRANCH}: ${#INT_TICKETS[@]}"

          is_int_ticket() {
            local k=$1 t
            for t in "${INT_TICKETS[@]:-}"; do [ "$k" = "$t" ] && return 0; done
            return 1
          }

          # 2) PR aperte -> tieni quelle il cui ticket è in-flight.
          #    Non si filtra per base: le PR "stacked" (base = un altro branch feature,
          #    non la linea rilasciata) devono comunque essere ri-applicate, altrimenti
          #    la loro feature sparisce da integration ad ogni reset. Il gate vero è il
          #    match del ticket con INT_TICKETS (is_int_ticket), non la base della PR.
          #    La lettura sta fuori dalla process substitution del ciclo: lì un errore di
          #    curl non propaga e una lista vuota sarebbe indistinguibile da "nessuna PR
          #    aperta", con il reset che prosegue buttando via le feature in-flight.
          #    Si pagina fino all'ultima pagina: fermarsi alla prima perderebbe le PR
          #    oltre la centesima senza che il reset se ne accorga, ri-applicando solo
          #    una parte delle feature in volo. Il cap sulle pagine evita che una
          #    risposta anomala dell'API tenga il job in ciclo per sempre.
          PRS_JSON='[]'
          page=1
          while :; do
            if ! PAGE_JSON=$(api "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100&page=${page}") \
               || ! printf '%s' "$PAGE_JSON" | jq -e 'type == "array"' >/dev/null; then
              slack "🛑 *${INTEGRATION_BRANCH} NON resettato*: lettura delle PR aperte non riuscita (<${REPO_URL}/actions/runs/${GITHUB_RUN_ID}|run>). Verificare che il caller conceda \`pull-requests: read\`."
              echo "::error::Lettura delle PR aperte non riuscita: ${INTEGRATION_BRANCH} non viene toccato. Serve 'pull-requests: read' sul job chiamante."
              exit 1
            fi
            PAGE_COUNT=$(printf '%s' "$PAGE_JSON" | jq 'length')
            PRS_JSON=$(printf '%s\n%s' "$PRS_JSON" "$PAGE_JSON" | jq -s 'add')
            [ "$PAGE_COUNT" -lt 100 ] && break
            if [ "$page" -ge 20 ]; then
              echo "::warning::20 pagine di PR aperte lette: lettura interrotta per sicurezza."
              break
            fi
            page=$((page + 1))
          done
          PR_COUNT=$(printf '%s' "$PRS_JSON" | jq 'length')
          echo "PR aperte (tutte le base): ${PR_COUNT}"

          reapply=()   # "num branch ticket"
          while IFS=$'\t' read -r num branch title; do
            [ -z "${num:-}" ] && continue
            ticket=$(printf '%s %s' "$branch" "$title" | grep -oE "$TICKET_RE" | head -1 || true)
            [ -z "$ticket" ] && continue
            match=""
            while read -r k; do
              [ -z "$k" ] && continue
              if is_int_ticket "$k"; then match=1; break; fi
            done < <(printf '%s %s' "$branch" "$title" | grep -oE "$TICKET_RE" | sort -u)
            [ -n "$match" ] && reapply+=("$num $branch $ticket")
          done < <(printf '%s' "$PRS_JSON" | jq -r '.[] | "\(.number)\t\(.head.ref)\t\(.title)"')

          # Ordine DECRESCENTE (PR piu' recente prima): per gli stack il branch del tip
          # contiene gia' i commit dei branch base sottostanti, quindi mergiandolo per
          # primo entra tutta la catena in un colpo; le eventuali PR base piu' vecchie,
          # se anch'esse candidate, si mergiano dopo come no-op (Already up to date).
          # Il contrario (dal piu' vecchio) applicherebbe prima una base parziale e poi
          # rischierebbe il conflitto sul tip.
          if [ "${#reapply[@]}" -gt 0 ]; then
            mapfile -t reapply < <(printf '%s\n' "${reapply[@]}" | sort -rn)
          fi
          echo "Feature in-flight da ri-applicare: ${#reapply[@]}"

          # 3) Reset alla base.
          git checkout -B "$INTEGRATION_BRANCH" "origin/${BASE_BRANCH}"

          # 4) Ri-applica i branch (tip degli stack prima); conflitti -> skip + registra.
          applied=()    # "num ticket"
          resolved=()   # "num ticket" - sottoinsieme di applied, risolto su file append-only
          conflicts=()  # "num branch ticket"
          if [ "${#reapply[@]}" -gt 0 ]; then
            for entry in "${reapply[@]}"; do
              read -r num branch ticket <<< "$entry"
              if ! git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
                conflicts+=("$num $branch $ticket")
                echo "branch origin/${branch} assente -> #${num} saltata"
                continue
              fi
              if git merge --no-ff -m "reapply ${branch} [PR #${num}]" "origin/${branch}"; then
                applied+=("$num $ticket")
                echo "ri-applicato #$num ($ticket)"
              elif resolve_append_only "$branch" \
                   && git commit --no-edit -m "reapply ${branch} [PR #${num}]"; then
                applied+=("$num $ticket")
                resolved+=("$num $ticket")
                echo "ri-applicato #$num ($ticket) risolvendo il conflitto append-only"
              else
                git merge --abort || true
                conflicts+=("$num $branch $ticket")
                echo "CONFLITTO #$num ($branch) -> saltato"
              fi
            done
          fi

          # 5) Push forzato.
          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry-run] niente push: ${INTEGRATION_BRANCH} sarebbe = ${BASE_BRANCH} + ${#applied[@]} feature (conflitti: ${#conflicts[@]})."
          else
            git push --force origin "$INTEGRATION_BRANCH"
            echo "${INTEGRATION_BRANCH} = ${BASE_BRANCH} + ${#applied[@]} feature in-flight (conflitti: ${#conflicts[@]})."
          fi

          # 6) Deploy sul branch di integrazione (workflow_dispatch esplicito).
          if [ -n "$DEPLOY_WORKFLOW" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] deploy ${DEPLOY_WORKFLOW} non lanciato."
            else
              api -X POST "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${DEPLOY_WORKFLOW}/dispatches" \
                -d "$(jq -n --arg r "$INTEGRATION_BRANCH" '{ref: $r}')" \
                && echo "Deploy ${DEPLOY_WORKFLOW} avviato." || echo "::warning::dispatch di ${DEPLOY_WORKFLOW} non riuscito."
            fi
          fi

          # 7) Report su Slack.
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "slack_webhook_url non configurato: salto notifica."
            exit 0
          fi
          msg="♻️ *${INTEGRATION_BRANCH} resettato a ${BASE_BRANCH}* — ${#applied[@]} feature in-flight ri-applicate"
          if [ "${#applied[@]}" -gt 0 ]; then
            for a in "${applied[@]}"; do
              read -r num ticket <<< "$a"
              msg="${msg}"$'\n'"• <${JIRA_BASE}/${ticket}|${ticket}> — <${REPO_URL}/pull/${num}|#${num}>"
            done
          fi
          if [ "${#resolved[@]}" -gt 0 ]; then
            msg="${msg}"$'\n'"🧩 di cui ${#resolved[@]} risolte in automatico sui file append-only."
          fi
          if [ "${#conflicts[@]}" -gt 0 ]; then
            msg="${msg}"$'\n'"⚠️ *${#conflicts[@]} PR da re-integrare a mano (conflitto):*"
            for c in "${conflicts[@]}"; do
              read -r num branch ticket <<< "$c"
              if [ -n "${ticket:-}" ]; then
                msg="${msg}"$'\n'"• <${JIRA_BASE}/${ticket}|${ticket}> — <${REPO_URL}/pull/${num}|#${num}> (${branch})"
              else
                msg="${msg}"$'\n'"• <${REPO_URL}/pull/${num}|#${num}> (${branch})"
              fi
            done
          fi
          slack "$msg"
          echo "Report Slack inviato."
